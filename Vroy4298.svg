<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a1f;stop-opacity:1" />
    </linearGradient>

    <!-- Neon purple glow for text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc" />
      <stop offset="40%" style="stop-color:#a855f7" />
      <stop offset="70%" style="stop-color:#818cf8" />
      <stop offset="100%" style="stop-color:#38bdf8" />
    </linearGradient>

    <!-- Glow filter for main text -->
    <filter id="glowText" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow for particles -->
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow for accents -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial glow behind text -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0" />
    </radialGradient>

    <!-- Grid line gradient -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#7c3aed;stop-opacity:0.18" />
      <stop offset="70%" style="stop-color:#818cf8;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0" />
    </linearGradient>

    <linearGradient id="gridFadeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#7c3aed;stop-opacity:0.12" />
      <stop offset="70%" style="stop-color:#818cf8;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0" />
    </linearGradient>

    <!-- Tag gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.25" />
    </linearGradient>

    <!-- Clip path for rounded border -->
    <clipPath id="roundClip">
      <rect x="0" y="0" width="900" height="300" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="300" rx="22" ry="22" fill="url(#bgGrad)" />

  <!-- Clip everything inside rounded rect -->
  <g clip-path="url(#roundClip)">

    <!-- Grid lines horizontal -->
    <line x1="0" y1="60" x2="900" y2="60" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="0" y1="180" x2="900" y2="180" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="url(#gridFade)" stroke-width="1"/>

    <!-- Grid lines vertical -->
    <line x1="90" y1="0" x2="90" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>
    <line x1="270" y1="0" x2="270" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>
    <line x1="630" y1="0" x2="630" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>
    <line x1="810" y1="0" x2="810" y2="300" stroke="url(#gridFadeV)" stroke-width="1"/>

    <!-- Center radial glow -->
    <ellipse cx="450" cy="150" rx="380" ry="160" fill="url(#centerGlow)" />

    <!-- Decorative circles (top-left) -->
    <circle cx="55" cy="55" r="35" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="55" cy="55" r="22" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="55" cy="55" r="9" fill="#7c3aed" fill-opacity="0.5" />

    <!-- Decorative circles (bottom-right) -->
    <circle cx="845" cy="245" r="35" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="845" cy="245" r="22" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="845" cy="245" r="9" fill="#38bdf8" fill-opacity="0.5" />

    <!-- Floating particles (left cluster) -->
    <g filter="url(#particleGlow)">
      <circle cx="120" cy="90" r="3" fill="#a855f7" fill-opacity="0.8">
        <animate attributeName="cy" values="90;80;90" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="200" r="2" fill="#818cf8" fill-opacity="0.7">
        <animate attributeName="cy" values="200;190;200" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="90" cy="170" r="2.5" fill="#38bdf8" fill-opacity="0.6">
        <animate attributeName="cy" values="170;160;170" dur="4s" repeatCount="indefinite"/>
      </circle>
      <!-- Right cluster -->
      <circle cx="760" cy="80" r="3" fill="#38bdf8" fill-opacity="0.8">
        <animate attributeName="cy" values="80;70;80" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.8;0.3;0.8" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="210" r="2" fill="#a855f7" fill-opacity="0.7">
        <animate attributeName="cy" values="210;200;210" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="830" cy="140" r="2.5" fill="#c084fc" fill-opacity="0.6">
        <animate attributeName="cy" values="140;130;140" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <!-- Top particles -->
      <circle cx="340" cy="40" r="2" fill="#818cf8" fill-opacity="0.5">
        <animate attributeName="fill-opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="35" r="1.5" fill="#c084fc" fill-opacity="0.5">
        <animate attributeName="fill-opacity" values="0.5;0.1;0.5" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <!-- Bottom -->
      <circle cx="400" cy="265" r="2" fill="#38bdf8" fill-opacity="0.4">
        <animate attributeName="fill-opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="510" cy="270" r="1.5" fill="#a855f7" fill-opacity="0.4">
        <animate attributeName="fill-opacity" values="0.4;0.1;0.4" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Left decorative line accent -->
    <line x1="190" y1="100" x2="190" y2="200" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="185" y1="100" x2="195" y2="100" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="185" y1="200" x2="195" y2="200" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Right decorative line accent -->
    <line x1="710" y1="100" x2="710" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="705" y1="100" x2="715" y2="100" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="705" y1="200" x2="715" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Subtle top horizontal accent line -->
    <line x1="250" y1="72" x2="650" y2="72" stroke="url(#gridFade)" stroke-width="1" stroke-dasharray="4,6"/>
    <!-- Subtle bottom accent line -->
    <line x1="250" y1="228" x2="650" y2="228" stroke="url(#gridFade)" stroke-width="1" stroke-dasharray="4,6"/>

    <!-- "< />" code tag decorations -->
    <text x="220" y="145" font-family="'Courier New', monospace" font-size="18" fill="#7c3aed" fill-opacity="0.45" letter-spacing="1">&lt;/&gt;</text>
    <text x="660" y="155" font-family="'Courier New', monospace" font-size="18" fill="#38bdf8" fill-opacity="0.45" letter-spacing="1">&lt;/&gt;</text>

    <!-- Handle prefix -->
    <text x="450" y="122"
      font-family="'Courier New', Consolas, monospace"
      font-size="16"
      fill="#818cf8"
      fill-opacity="0.7"
      text-anchor="middle"
      letter-spacing="4">@github</text>

    <!-- MAIN TEXT: Vroy4298 -->
    <text
      x="450"
      y="190"
      font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif"
      font-size="88"
      font-weight="900"
      text-anchor="middle"
      letter-spacing="4"
      fill="url(#textGrad)"
      filter="url(#glowText)"
    >Vroy4298</text>

    <!-- Subtle "developer" tagline -->
    <rect x="335" y="210" width="232" height="26" rx="13" fill="url(#tagGrad)" />
    <text x="451" y="228"
      font-family="'Arial', sans-serif"
      font-size="12"
      fill="#c084fc"
      fill-opacity="0.9"
      text-anchor="middle"
      letter-spacing="5"
      font-weight="600">✦  DEVELOPER  ✦</text>

    <!-- Corner bracket decorations -->
    <!-- Top-left -->
    <polyline points="28,28 28,10 46,10" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top-right -->
    <polyline points="872,28 872,10 854,10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-left -->
    <polyline points="28,272 28,290 46,290" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-right -->
    <polyline points="872,272 872,290 854,290" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- Outer border glow -->
  <rect x="1" y="1" width="898" height="298" rx="22" ry="22"
    fill="none"
    stroke="url(#textGrad)"
    stroke-width="1.5"
    stroke-opacity="0.5"
  />
</svg>
